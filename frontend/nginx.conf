server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Polled by open pages to notice a new deployment: never cache it.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Docker's DNS, re-resolved so a restarted API container (new IP) is found without
    # restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Claude answers can take a while.
        proxy_read_timeout 120s;
        # Messages carry up to 4 images of 3 MB, base64-encoded in JSON.
        client_max_body_size 20m;
    }

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
